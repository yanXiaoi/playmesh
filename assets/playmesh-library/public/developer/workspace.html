<div id="workspaceMessages" class="workspace-messages" aria-live="polite" aria-atomic="true"></div>

  <button id="publish" class="publish" data-i18n-title="workspace.export_project"><span class="toolbar-wide" data-i18n="workspace.export"></span><svg class="lucide toolbar-compact" aria-hidden="true"><use href="#file-archive"></use></svg></button>
  <button id="aiPanel" class="ai-action" data-i18n-title="workspace.open_ai_development"><span class="toolbar-wide" data-i18n="workspace.ai"></span><svg class="lucide toolbar-compact" aria-hidden="true"><use href="#sparkles"></use></svg></button>

</header>
<div class="work">

    <textarea id="source" data-i18n-aria-label="workspace.current_file_source"></textarea>
    <div id="imageViewer" class="image-viewer"><img id="imagePreview" width="640" height="360" data-i18n-alt="workspace.project_image_preview"><p id="binaryMessage"></p></div>

      <button id="stop" type="button" data-i18n-title="workspace.stop_game_title" disabled><svg class="lucide" aria-hidden="true"><use href="#square"></use></svg><span data-i18n="workspace.stop_game"></span></button>

</div>

<div id="toolbarMenu" class="toolbar-menu anchored-menu" role="menu">

  <button id="quickPanel" role="menuitem" data-i18n="workspace.conversation_console"></button>

  <button id="capabilityTests" role="menuitem"><svg class="lucide" aria-hidden="true"><use href="#circle-dot"></use></svg><span data-i18n="workspace.capability_tests"></span></button>
  <button id="diff" role="menuitem"><svg class="lucide" aria-hidden="true"><use href="#file-diff"></use></svg><span data-i18n="workspace.file_diff"></span></button>
  <button id="clearGameData" class="danger-action" role="menuitem" data-i18n-title="workspace.clear_game_data_title" data-i18n="workspace.clear_game_data"></button>
</div>
<span id="delete" hidden aria-hidden="true"></span>

<div id="projectPickerMenu" class="project-menu anchored-menu" role="menu">

    <button id="projectSettingsFromPicker" role="menuitem" data-i18n="workspace.project_settings"></button>

  <div id="projectList" class="project-list"></div>
  <div id="projectEmpty" class="project-empty" hidden data-i18n="workspace.no_matching_projects"></div>
</div>

<div id="diffModal" class="modal" role="dialog" aria-modal="true" data-i18n-aria-label="workspace.diff_title"><div class="dialog diff-dialog">
  <div class="dialog-head"><strong id="diffTitle" data-i18n="workspace.diff_title"></strong><button id="saveDiffTarget" class="primary" disabled data-i18n="workspace.save_applied_chunks"></button><button data-close="diffModal" data-i18n-title="workspace.close" data-i18n-aria-label="workspace.close"><svg class="lucide" aria-hidden="true"><use href="#x"></use></svg></button></div>

<div id="quickModal" class="modal" role="dialog" aria-modal="true" data-i18n-aria-label="workspace.conversation_console"><div class="dialog conversation-console-dialog">

  </div>
</div></div>

<div id="webviewJavaScriptModal" class="modal" role="dialog" aria-modal="true" data-i18n-aria-label="workspace.webview_javascript_console"><div class="dialog webview-javascript-dialog">
  <div class="dialog-head"><strong data-i18n="workspace.webview_javascript_console"></strong><button id="webviewJavaScriptHistory" data-i18n="workspace.history"></button><button id="executeWebViewJavaScript" class="primary" data-i18n="workspace.execute"></button><button data-close="webviewJavaScriptModal" data-i18n-title="workspace.close" data-i18n-aria-label="workspace.close"><svg class="lucide" aria-hidden="true"><use href="#x"></use></svg></button></div>

<div id="manifestModal" class="modal" role="dialog" aria-modal="true" data-i18n-aria-label="workspace.project_settings"><div class="dialog manifest-dialog">
  <div class="dialog-head"><strong data-i18n="workspace.project_settings"></strong><span id="manifestState" aria-live="polite"></span><button data-close="manifestModal" data-i18n-title="workspace.close" data-i18n-aria-label="workspace.close"><svg class="lucide" aria-hidden="true"><use href="#x"></use></svg></button></div>
  <form id="manifestForm" class="manifest-form">
    <section><h3 translate="no">main.json</h3><div class="manifest-grid">
      <label><span data-i18n="workspace.name"></span><input id="manifestName" name="manifestName" data-initial-focus required maxlength="80" autocomplete="off"></label>
      <label class="wide"><span data-i18n="workspace.description"></span><textarea id="manifestRemarks" name="manifestRemarks" maxlength="500" rows="3" autocomplete="off"></textarea></label>
      <label><span data-i18n="workspace.game_version"></span><input id="manifestVersion" name="manifestVersion" required pattern="\d+\.\d+\.\d+" autocomplete="off"></label>
      <label><span data-i18n="workspace.sdk_version"></span><input id="manifestSdkVersion" name="manifestSdkVersion" required pattern="\d+\.\d+\.\d+" autocomplete="off" readonly></label>
      <p class="manifest-help wide" data-i18n="workspace.sdk_version_managed_help"></p>
      <label><span data-i18n="workspace.main_orientation"></span><select id="manifestOrientation" name="manifestOrientation"><option value="landscape" data-i18n="workspace.landscape"></option><option value="portrait" data-i18n="workspace.portrait"></option></select></label>
      <label id="manifestControllerOrientationField" hidden><span data-i18n="workspace.controller_orientation"></span><select id="manifestControllerOrientation" name="manifestControllerOrientation"><option value="portrait" data-i18n="workspace.portrait"></option><option value="landscape" data-i18n="workspace.landscape"></option></select></label>
      <label><span data-i18n="workspace.game_mode"></span><select id="manifestMode" name="manifestMode"><option value="multiplayer" data-i18n="workspace.multiplayer_game"></option><option value="solo" data-i18n="workspace.solo_game"></option></select></label>
      <label><span data-i18n="workspace.display_mode"></span><select id="manifestDisplayMode" name="manifestDisplayMode"><option value="multi_screen" data-i18n="workspace.multi_screen"></option><option value="single_screen_multiplayer" data-i18n="workspace.single_screen_multiplayer"></option></select></label>
      <label><span data-i18n="workspace.minimum_players"></span><input id="manifestMin" name="manifestMin" type="number" inputmode="numeric" min="1" max="32" required></label>
      <label><span data-i18n="workspace.maximum_players"></span><input id="manifestMax" name="manifestMax" type="number" inputmode="numeric" min="1" max="32" required></label>
      <p class="manifest-help wide" data-i18n="workspace.package_icon_help"></p>
      <label class="wide"><span data-i18n="workspace.game_entry"></span><input id="manifestGameEntry" name="manifestGameEntry" required data-i18n-placeholder="workspace.game_entry_placeholder" autocomplete="off"></label>
      <label class="wide"><span data-i18n="workspace.controller_entry"></span><input id="manifestControllerEntry" name="manifestControllerEntry" required data-i18n-placeholder="workspace.controller_entry_placeholder" autocomplete="off"></label>
      <label class="wide"><span data-i18n="workspace.authority_entry"></span><input id="manifestAuthorityEntry" name="manifestAuthorityEntry" data-i18n-placeholder="workspace.authority_entry_placeholder" autocomplete="off"></label>

    <div class="manifest-tags-field"><span data-i18n="workspace.tags"></span><div id="manifestTags" class="manifest-tags"></div><div class="input-action"><input id="manifestTagInput" name="manifestTagInput" maxlength="64" data-i18n-placeholder="workspace.tag_placeholder" autocomplete="off"><button id="manifestTagAdd" class="tag-add-button" type="button" data-i18n-title="workspace.add" data-i18n-aria-label="workspace.add"><svg class="lucide" aria-hidden="true"><use href="#plus"></use></svg></button></div></div>
    </section>
    <section class="manifest-capability-section"><h3 translate="no">capabilities.json</h3><p class="manifest-help" data-i18n="workspace.capability_manifest_help"></p><strong data-i18n="workspace.main_capabilities"></strong><div id="capabilityOptions" class="capability-picker"></div><div id="controllerCapabilitySection" hidden><strong data-i18n="workspace.controller_capabilities"></strong><div id="controllerCapabilityOptions" class="capability-picker"></div></div></section>

    <div class="manifest-actions"><button type="button" data-close="manifestModal" data-i18n="workspace.cancel"></button><button type="submit" class="primary" data-i18n="workspace.save_project_settings"></button></div>
  </form>
</div></div>

  <div class="dialog-head"><strong data-i18n="workspace.create_project_title"></strong><button data-close="projectModal" data-i18n-title="workspace.close" data-i18n-aria-label="workspace.close"><svg class="lucide" aria-hidden="true"><use href="#x"></use></svg></button></div>

    <label><span data-i18n="workspace.name"></span><input id="projectName" name="projectName" required maxlength="80" data-i18n-placeholder="workspace.project_name_placeholder" autocomplete="off"></label>
    <label class="project-description wide"><span data-i18n="workspace.description"></span><textarea id="projectDescription" name="projectDescription" maxlength="500" rows="3" data-i18n-placeholder="workspace.project_description_placeholder" autocomplete="off"></textarea></label>
    <label><span data-i18n="workspace.game_mode"></span><select id="projectMode" name="projectMode"><option value="multiplayer" data-i18n="workspace.multiplayer_game"></option><option value="solo" data-i18n="workspace.solo_game"></option></select></label>
    <label><span data-i18n="workspace.main_orientation"></span><select id="projectOrientation" name="projectOrientation"><option value="landscape" data-i18n="workspace.landscape"></option><option value="portrait" data-i18n="workspace.portrait"></option></select></label>
    <label><span data-i18n="workspace.display_mode"></span><select id="projectDisplayMode" name="projectDisplayMode"><option value="multi_screen" data-i18n="workspace.multi_screen"></option><option value="single_screen_multiplayer" data-i18n="workspace.single_screen_multiplayer"></option></select></label>
    <label id="projectControllerOrientationField" hidden><span data-i18n="workspace.controller_orientation"></span><select id="projectControllerOrientation" name="projectControllerOrientation"><option value="portrait" data-i18n="workspace.portrait"></option><option value="landscape" data-i18n="workspace.landscape"></option></select></label>
    <label><span data-i18n="workspace.minimum_players"></span><input id="projectMin" name="projectMin" type="number" inputmode="numeric" min="1" max="32" value="2"></label>
    <label><span data-i18n="workspace.maximum_players"></span><input id="projectMax" name="projectMax" type="number" inputmode="numeric" min="1" max="32" value="5"></label>

    <section class="project-capabilities wide"><strong data-i18n="workspace.main_capabilities"></strong><p data-i18n="workspace.create_capabilities_help"></p><div id="projectCapabilityOptions" class="capability-picker"></div><div id="projectControllerCapabilitySection" hidden><strong data-i18n="workspace.controller_capabilities"></strong><div id="projectControllerCapabilityOptions" class="capability-picker"></div></div></section>
    <div id="projectError" class="form-error" aria-live="polite"></div>
    <button type="submit" class="primary" data-i18n="workspace.create_project"></button>
  </form>
</div></div>

  <div class="dialog-head"><strong data-i18n="workspace.copy_project_title"></strong><button data-close="copyProjectModal" data-i18n-title="workspace.close" data-i18n-aria-label="workspace.close"><svg class="lucide" aria-hidden="true"><use href="#x"></use></svg></button></div>
