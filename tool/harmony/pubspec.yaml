name: playmesh
description: "HarmonyOS release dependency set for Playmesh."
publish_to: 'none'

# tool/build_release.ps1 replaces this with the canonical pubspec version in
# its isolated Harmony staging directory.
version: 0.0.0+0

environment:
  # The pinned Harmony Flutter 3.22.3 fork ships Dart 3.4.0.
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  http: 1.2.2
  webview_flutter:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      ref: 08c826062be5e8753bb625b9d44e48da7fedd8bd
      path: packages/webview_flutter/webview_flutter
  web_socket_channel: 3.0.1
  qr_flutter: 4.1.0
  qr: 3.0.2
  path_provider:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      ref: d8bf2cf9d726cce4d308521f4fb500d832523002
      path: packages/path_provider/path_provider
  path_provider_ohos:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      ref: d8bf2cf9d726cce4d308521f4fb500d832523002
      path: packages/path_provider/path_provider_ohos
  mobile_scanner:
    git:
      url: https://gitee.com/openharmony-sig/fluttertpc_mobile_scanner.git
      ref: d8c21154d22582f51f24f6d8e1dcc59ff9b09b5a
  archive: 3.6.1
  file_selector:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      ref: da5906bd4416c5ec5cb4d0840dbc197efeb2e208
      path: packages/file_selector/file_selector
  flutter_fullscreen: 1.2.0
  window_manager: 0.5.2
  share_plus:
    git:
      url: https://gitee.com/openharmony-sig/flutter_plus_plugins.git
      ref: 093085d5ebc487ebc95c00ea77d72f6d1f9f2801
      path: packages/share_plus/share_plus
  # The Dart interface is reused, while @playmesh/harmony_capabilities
  # supplies the OHOS event channels. The upstream OHOS sensor plugin has an
  # obsolete Dart <3.0 constraint and cannot be used with Flutter 3.22.
  sensors_plus: 6.1.0

dependency_overrides:
  # The upstream OHOS implementation imports the HMS-only @kit.ScanKit,
  # which is absent from the OpenHarmony Public SDK. Keep the app-facing API
  # buildable and present a manual-entry fallback on pure OpenHarmony builds.
  mobile_scanner:
    path: ohos/mobile_scanner_compat
  flutter_fullscreen:
    path: ohos/flutter_fullscreen_compat
  window_manager:
    path: ohos/window_manager_compat
  share_plus:
    path: ohos/share_plus_compat
  file_selector_ohos:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      ref: da5906bd4416c5ec5cb4d0840dbc197efeb2e208
      path: packages/file_selector/file_selector_ohos
  # share_plus_platform_interface still declares path_provider from master.
  # Force the full graph to the same reviewed commit as the direct dependency.
  path_provider:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      ref: d8bf2cf9d726cce4d308521f4fb500d832523002
      path: packages/path_provider/path_provider
  path_provider_ohos:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      ref: d8bf2cf9d726cce4d308521f4fb500d832523002
      path: packages/path_provider/path_provider_ohos
  share_plus_platform_interface:
    git:
      url: https://gitee.com/openharmony-sig/flutter_plus_plugins.git
      ref: 093085d5ebc487ebc95c00ea77d72f6d1f9f2801
      path: packages/share_plus/share_plus_platform_interface
  webview_flutter_ohos:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      ref: 08c826062be5e8753bb625b9d44e48da7fedd8bd
      path: packages/webview_flutter/webview_flutter_ohos
  webview_flutter_platform_interface:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      ref: 08c826062be5e8753bb625b9d44e48da7fedd8bd
      path: packages/webview_flutter/webview_flutter_platform_interface

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/playmesh-library/public/sdk/v1/
    - assets/playmesh-library/public/developer/
    - assets/playmesh-library/public/developer/prompts/
    - assets/playmesh-library/public/developer/editor/node_modules/codemirror/lib/
    - assets/playmesh-library/public/developer/editor/node_modules/codemirror/theme/
    - assets/playmesh-library/public/developer/editor/node_modules/codemirror/mode/xml/
    - assets/playmesh-library/public/developer/editor/node_modules/codemirror/mode/css/
    - assets/playmesh-library/public/developer/editor/node_modules/codemirror/mode/javascript/
    - assets/playmesh-library/public/developer/editor/node_modules/codemirror/addon/hint/
    - assets/playmesh-library/public/developer/editor/node_modules/codemirror/addon/edit/
    - assets/playmesh-library/public/developer/templates/default-game/
    - assets/playmesh-library/public/developer/templates/default-game/package/
    - assets/playmesh-library/public/developer/templates/default-game/package/app/
    - assets/playmesh-library/public/developer/templates/default-game/package/app/controller/
    - assets/playmesh-library/public/developer/templates/default-game/package/app/static/css/
    - assets/playmesh-library/public/developer/templates/default-game/package/app/static/js/player/
    - assets/playmesh-library/public/developer/templates/default-game/package/app/static/js/service/
    - assets/playmesh-library/public/developer/templates/default-game/package/app/static/js/shared/
    - assets/playmesh-library/public/developer/templates/default-game/variants/solo/
    - assets/playmesh-library/public/developer/contracts/
    - assets/playmesh-library/public/developer/contracts/schemas/
