<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="admin.site_title"></title>
  <script>
    (() => {
      const root = document.documentElement;
      root.dataset.uiBooting = "true";
      root.dataset.theme = "light";
      root.style.colorScheme = "light";
      try {
        const saved = localStorage.getItem("playmesh.locale");
        const locale = saved || (Array.isArray(navigator.languages) ? navigator.languages[0] : "") || navigator.language;
        if (locale) root.lang = locale;
      } catch (_) {}
      window.__playmeshRevealUI = () => {
        clearTimeout(window.__playmeshRevealTimer);
        root.removeAttribute("data-ui-booting");
      };
      window.__playmeshRevealTimer = setTimeout(window.__playmeshRevealUI, 4000);
    })();
  </script>
  <link rel="stylesheet" href="{{ADMIN_ASSET_BASE}}/gocaptcha.global.css">
  <link rel="stylesheet" href="{{ADMIN_ASSET_BASE}}/style.css">
  <script defer src="{{ADMIN_ASSET_BASE}}/gocaptcha.global.js"></script>
  <script defer src="{{ADMIN_ASSET_BASE}}/captcha.js"></script>
  <script defer src="{{ADMIN_ASSET_BASE}}/admin.js"></script>
</head>
<body>
  <section id="login-view" class="login-wrap">
    <article class="panel login-card">
      <div class="brand"><span class="brand-mark">P</span> <span data-i18n="admin.site_title"></span></div>
      <h1 data-i18n="admin.login.title"></h1>
      <form id="login-form" class="stack">
        <label data-i18n-label="admin.login.username"><input name="username" required autocomplete="username"></label>
        <label data-i18n-label="admin.login.password"><input name="password" type="password" required autocomplete="current-password"></label>
        <button type="submit" data-i18n="admin.login.submit"></button>
      </form>
    </article>
  </section>

  <main id="admin-view" class="shell admin-shell hidden">
    <div class="admin-layout">
      <aside class="panel sidebar">
        <div class="sidebar-head">
          <div class="brand">
            <span class="brand-mark">P</span>
            <span class="brand-name">Playmesh</span>
          </div>
        </div>
        <nav class="nav" aria-label="Admin sections">
          <button class="active" data-section="overview" data-i18n="admin.nav.overview"></button>
          <button data-section="users" data-i18n="admin.nav.users"></button>
          <button data-section="games" data-i18n="admin.nav.games"></button>
          <button data-section="settings" data-i18n="admin.nav.settings"></button>
          <button data-section="config" data-i18n="admin.nav.config"></button>
        </nav>
        <div class="sidebar-tools">
          <select id="admin-locale" class="hidden" aria-label="" data-i18n-aria="settings.language"></select>
          <a id="public-page-link" class="button secondary sidebar-tool" href="#" target="_blank" rel="noopener noreferrer" data-i18n-aria="admin.nav.public">
            <span class="sidebar-tool-icon" aria-hidden="true">↗</span>
            <span class="sidebar-tool-text" data-i18n="admin.nav.public"></span>
          </a>
          <button id="logout" class="danger sidebar-tool" data-i18n-aria="nav.logout">
            <span class="sidebar-tool-icon" aria-hidden="true">↪</span>
            <span class="sidebar-tool-text" data-i18n="nav.logout"></span>
          </button>
        </div>
      </aside>
      <section class="admin-content">
        <div id="overview-section" class="admin-section">
          <div class="section-head"><div><div class="eyebrow" data-i18n="admin.overview.eyebrow"></div><h2 data-i18n="admin.overview.title"></h2></div><span id="stats-time" class="muted"></span></div>
          <div id="stats" class="stats"></div>
          <div class="panel">
            <h2 data-i18n="admin.overview.boundary_title"></h2>
            <p class="muted" data-i18n="admin.overview.boundary_description"></p>
          </div>
        </div>
        <div id="users-section" class="admin-section hidden">
          <div class="section-head">
            <div><div class="eyebrow" data-i18n="admin.users.eyebrow"></div><h2 data-i18n="admin.users.title"></h2></div>
            <button type="button" id="admin-add-user" data-i18n="admin.users.add"></button>
          </div>
          <div class="admin-filters">
            <select id="admin-user-status">
              <option value="" data-i18n="admin.users.all_statuses"></option>
              <option value="active" data-i18n="admin.users.active"></option>
              <option value="pending_verification" data-i18n="admin.users.pending"></option>
              <option value="disabled" data-i18n="admin.users.disabled"></option>
            </select>
            <input id="admin-user-search" placeholder="" data-i18n-placeholder="admin.users.search">
            <button id="admin-user-refresh" data-i18n="common.refresh"></button>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th data-i18n="admin.users.account"></th>
                <th data-i18n="admin.users.status"></th>
                <th data-i18n="admin.users.games"></th>
                <th data-i18n="admin.users.created_at"></th>
                <th data-i18n="common.actions"></th>
              </tr></thead>
              <tbody id="user-rows"></tbody>
            </table>
          </div>
          <div class="pager">
            <button id="admin-user-previous" class="secondary" data-i18n="common.previous"></button>
            <span id="admin-user-page" class="muted"></span>
            <button id="admin-user-next" class="secondary" data-i18n="common.next"></button>
          </div>
        </div>
        <div id="games-section" class="admin-section hidden">
          <div class="section-head"><div><div class="eyebrow" data-i18n="admin.games.eyebrow"></div><h2 data-i18n="admin.games.title"></h2></div></div>
          <div class="admin-filters">
            <select id="admin-status">
              <option value="" data-i18n="admin.games.all_statuses"></option><option value="pending" data-i18n="games.pending"></option>
              <option value="approved" data-i18n="games.approved"></option><option value="rejected" data-i18n="games.rejected"></option>
              <option value="deleting" data-i18n="games.deleting"></option>
            </select>
            <input id="admin-search" placeholder="" data-i18n-placeholder="admin.games.search">
            <button id="admin-refresh" data-i18n="common.refresh"></button>
          </div>
          <div class="table-wrap">
            <table><thead><tr><th data-i18n="admin.games.game"></th><th data-i18n="admin.games.publisher_account"></th><th data-i18n="games.status"></th><th data-i18n="admin.games.scan"></th><th data-i18n="admin.games.uploaded_at"></th><th data-i18n="common.actions"></th></tr></thead>
            <tbody id="game-rows"></tbody></table>
          </div>
          <div class="pager"><button id="admin-previous" class="secondary" data-i18n="common.previous"></button><span id="admin-page" class="muted"></span><button id="admin-next" class="secondary" data-i18n="common.next"></button></div>
        </div>
        <div id="settings-section" class="admin-section hidden">
          <div class="section-head"><div><div class="eyebrow" data-i18n="admin.settings.eyebrow"></div><h2 data-i18n="admin.settings.title"></h2></div></div>
          <form id="settings-form" class="panel stack">
            <label data-i18n-label="admin.settings.name"><input name="name"></label>
            <label data-i18n-label="admin.settings.builder"><input name="author"></label>
            <label data-i18n-label="admin.settings.homepage"><input name="homepage" type="url" placeholder="https://"></label>
            <label class="choice-field"><input name="supportsGameRelay" type="checkbox"><span data-i18n="admin.settings.supports_relay"></span></label>
            <button type="submit" data-i18n="admin.settings.save"></button>
            <div id="settings-notice" class="notice"></div>
          </form>
        </div>
        <div id="config-section" class="admin-section hidden">
          <div class="section-head">
            <div><div class="eyebrow" data-i18n="admin.config.eyebrow"></div><h2 data-i18n="admin.config.title"></h2></div>
          </div>
          <form id="config-form" class="panel stack">
            <p class="muted" data-i18n="admin.config.description"></p>
            <h3 data-i18n="admin.config.network"></h3>
            <div class="filters">
              <label class="wide" data-i18n-label="admin.config.external_listen"><input name="externalListen" required></label>
              <label class="wide" data-i18n-label="admin.config.admin_listen"><input name="adminListen" required></label>
              <label class="wide" data-i18n-label="admin.config.public_base_url"><input name="relayBaseURL" type="url" placeholder="https://"></label>
              <label class="choice-field wide"><input name="showPublicSourceQRCode" type="checkbox"><span data-i18n="admin.config.show_qr"></span></label>
              <label class="choice-field wide"><input name="allowUserRegistration" type="checkbox"><span data-i18n="admin.config.allow_registration"></span></label>
              <label class="choice-field wide"><input name="requireEmailVerification" type="checkbox"><span data-i18n="admin.config.require_verification"></span></label>
              <label data-i18n-label="admin.config.session_minutes"><input name="sessionTTL" type="number" min="1"></label>
              <label data-i18n-label="admin.config.login_rate_ms"><input name="loginInterval" type="number" min="100"></label>
            </div>
            <h3 data-i18n="admin.config.storage"></h3>
            <div class="filters">
              <label class="wide" data-i18n-label="admin.config.database_path"><input name="databasePath" required></label>
              <label class="wide" data-i18n-label="admin.config.games_directory"><input name="gamesDirectory" required></label>
              <label class="wide" data-i18n-label="admin.config.quarantine_directory"><input name="quarantineDirectory" required></label>
              <label data-i18n-label="admin.config.max_upload"><input name="maxUploadMiB" type="number" min="1"></label>
              <label data-i18n-label="admin.config.max_expanded"><input name="maxExpandedMiB" type="number" min="1"></label>
              <label data-i18n-label="admin.config.max_file"><input name="maxFileMiB" type="number" min="1"></label>
              <label data-i18n-label="admin.config.max_files"><input name="maxFiles" type="number" min="1"></label>
              <label data-i18n-label="admin.config.max_ratio"><input name="maxRatio" type="number" min="1"></label>
              <label data-i18n-label="admin.config.max_scans"><input name="maxConcurrentScans" type="number" min="1" max="64"></label>
              <label data-i18n-label="admin.config.upload_interval"><input name="uploadInterval" type="number" min="1"></label>
            </div>
            <h3>ClamAV</h3>
            <p class="muted"><span data-i18n="admin.config.clamav_prefix"></span>
              <a href="https://docs.clamav.net/manual/Installing.html" target="_blank" rel="noopener noreferrer" data-i18n="admin.config.clamav_link"></a>
              <span data-i18n="admin.config.clamav_suffix"></span></p>
            <div class="filters">
              <label class="wide" data-i18n-label="admin.config.clamscan_path"><input name="clamScanPath"></label>
              <label data-i18n-label="admin.config.scan_timeout"><input name="scanTimeout" type="number" min="1"></label>
              <label class="choice-field"><input name="scanRequired" type="checkbox"><span data-i18n="admin.config.scan_required"></span></label>
            </div>
            <label data-i18n-label="admin.config.content_rules">
              <textarea name="contentRules" rows="16" spellcheck="false"></textarea>
            </label>
            <h3 data-i18n="admin.config.relay"></h3>
            <div class="filters">
              <label data-i18n-label="admin.config.tunnel_ttl"><input name="tunnelTTL" type="number" min="1"></label>
              <label data-i18n-label="admin.config.max_tunnels"><input name="maxTunnels" type="number" min="1"></label>
              <label data-i18n-label="admin.config.max_per_tunnel"><input name="maxPerTunnel" type="number" min="1"></label>
              <label data-i18n-label="admin.config.max_per_ip"><input name="maxPerIP" type="number" min="1"></label>
              <label class="wide" data-i18n-label="admin.config.turn_udp_listen"><input name="turnUdpListen" required></label>
              <label class="wide" data-i18n-label="admin.config.turn_tcp_listen"><input name="turnTcpListen" required></label>
              <label data-i18n-label="admin.config.turn_public_ip"><input name="turnPublicIp" required></label>
              <label data-i18n-label="admin.config.turn_public_port"><input name="turnPublicPort" type="number" min="1" max="65535"></label>
              <label data-i18n-label="admin.config.turn_realm"><input name="turnRealm" required></label>
              <label data-i18n-label="admin.config.turn_min_port"><input name="turnMinPort" type="number" min="1024" max="65535"></label>
              <label data-i18n-label="admin.config.turn_max_port"><input name="turnMaxPort" type="number" min="1024" max="65535"></label>
              <label class="choice-field"><input name="supportsRelay" type="checkbox"><span data-i18n="admin.config.supports_relay"></span></label>
            </div>
            <label data-i18n-label="admin.config.whitelist">
              <textarea name="whitelist" rows="7" spellcheck="false"></textarea>
            </label>
            <button type="submit" data-i18n="admin.config.save"></button>
            <div id="config-notice" class="notice"></div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <dialog id="detail-dialog">
    <div class="section-head"><h2 data-i18n="admin.detail.title"></h2><button id="close-dialog" class="secondary" data-i18n="common.close"></button></div>
    <pre id="detail-content"></pre>
  </dialog>

  <dialog id="create-user-dialog" class="my-dialog">
    <div class="dialog-heading">
      <h2 data-i18n="admin.users.add"></h2>
      <button type="button" class="secondary" data-close-admin-dialog data-i18n="common.close"></button>
    </div>
    <form id="create-user-form" class="stack">
      <label data-i18n-label="auth.email"><input name="email" type="email" required autocomplete="off"></label>
      <label data-i18n-label="auth.display_name"><input name="displayName" maxlength="40"></label>
      <label data-i18n-label="auth.password"><input name="password" type="password" minlength="10" maxlength="128" required autocomplete="new-password"></label>
      <label class="choice-field"><input name="disabled" type="checkbox"><span data-i18n="admin.users.create_disabled"></span></label>
      <button type="submit" data-i18n="admin.users.create"></button>
    </form>
  </dialog>

  <dialog id="admin-reason-dialog" class="my-dialog">
    <div class="dialog-heading">
      <h2 id="admin-reason-title"></h2>
      <button type="button" class="secondary" data-close-admin-dialog data-i18n="common.close"></button>
    </div>
    <form id="admin-reason-form" class="stack">
      <label data-i18n-label="admin.reason.label"><textarea name="reason" rows="5" maxlength="2000" required></textarea></label>
      <button type="submit" data-i18n="common.confirm"></button>
    </form>
  </dialog>

  <dialog id="admin-captcha-dialog" class="captcha-dialog" aria-label="" data-i18n-aria="auth.captcha_title">
    <div id="admin-captcha-widget" class="captcha-host"></div>
  </dialog>
</body>
</html>
