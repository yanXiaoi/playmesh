<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="site.title"></title>
  <script>
    (() => {
      const root = document.documentElement;
      root.dataset.uiBooting = "true";
      root.dataset.theme = "light";
      root.style.colorScheme = "light";
      try {
        const saved = localStorage.getItem("playmesh.locale");
        const locale = saved || (Array.isArray(navigator.languages) ? navigator.languages[0] : "") || navigator.language;
        if (locale) root.lang = locale;
      } catch (_) {}
      window.__playmeshRevealUI = () => {
        clearTimeout(window.__playmeshRevealTimer);
        root.removeAttribute("data-ui-booting");
      };
      window.__playmeshRevealTimer = setTimeout(window.__playmeshRevealUI, 4000);
    })();
  </script>
  <link rel="stylesheet" href="/assets/gocaptcha.global.css">
  <link rel="stylesheet" href="/assets/style.css">
  <script defer src="/assets/gocaptcha.global.js"></script>
  <script defer src="/assets/captcha.js"></script>
  <script defer src="/assets/user.js"></script>
</head>
<body class="user-site">
  <main class="shell user-shell">
    <header class="topbar site-header">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span data-i18n="site.title"></span>
      </a>
      <nav class="primary-nav" aria-label="" data-i18n-aria="user.nav.aria">
        <a href="/" data-user-view="home" data-i18n="nav.home"></a>
        <a href="/games" data-user-view="games" data-i18n="nav.library"></a>
        <a href="/my" data-user-view="my" data-i18n="nav.my"></a>
      </nav>
      <div class="row-actions">
        <select id="locale-select" class="hidden" aria-label="" data-i18n-aria="settings.language"></select>
      </div>
    </header>

    <section id="user-home-view" class="page-view">
      <section class="home-hero">
        <article class="home-intro">
          <div class="eyebrow" data-i18n="user.hero.eyebrow"></div>
          <h1 data-i18n="user.hero.title"></h1>
          <p data-i18n="user.hero.description"></p>
          <a class="button hero-action" href="/games" data-i18n="user.hero.browse"></a>
        </article>
        <aside class="source-card">
          <div class="source-orbit">
            <span class="orbit-dot orbit-dot-one" aria-hidden="true"></span>
            <span class="orbit-dot orbit-dot-two" aria-hidden="true"></span>
            <div class="source-qr-frame">
              <img id="source-qr-image" class="source-qr-image hidden" alt="" data-i18n-alt="user.source.qr_alt">
            </div>
          </div>
          <div class="source-card-copy">
            <div class="eyebrow" data-i18n="user.source.eyebrow"></div>
            <h2 data-i18n="user.source.title"></h2>
            <p data-i18n="user.source.description"></p>
            <label class="source-url-label">
              <span data-i18n="user.source.url"></span>
              <span class="copy-row">
                <input id="public-source-url" readonly aria-label="" data-i18n-aria="user.source.url">
                <button type="button" class="secondary" data-copy-target="public-source-url" data-i18n="common.copy"></button>
              </span>
            </label>
            <div id="source-info-notice" class="notice source-status" data-i18n="user.source.loading"></div>
          </div>
        </aside>
      </section>

    </section>

    <section id="user-my-view" class="page-view hidden">
      <div class="my-heading">
        <div class="eyebrow" data-i18n="user.my.eyebrow"></div>
        <h1 data-i18n="user.my.title"></h1>
        <p data-i18n="user.my.description"></p>
      </div>

      <div id="my-loading" class="panel my-loading" data-i18n="user.my.checking"></div>

      <section id="auth-panel" class="my-auth-shell hidden">
        <div class="my-auth-intro">
          <div class="eyebrow" data-i18n="user.my.auth_eyebrow"></div>
          <h2 data-i18n="user.my.auth_title"></h2>
          <p data-i18n="user.my.auth_description"></p>
        </div>
        <div class="panel auth-panel">
        <div class="tabs">
          <button type="button" class="active" data-auth-tab="login" data-i18n="nav.login"></button>
          <button type="button" data-auth-tab="register" data-i18n="nav.register"></button>
        </div>
        <form id="login-form" class="stack">
          <label data-i18n-label="auth.email"><input name="email" type="email" required autocomplete="email"></label>
          <label data-i18n-label="auth.password"><input name="password" type="password" required autocomplete="current-password"></label>
          <button type="submit" data-i18n="nav.login"></button>
        </form>
        <form id="register-form" class="stack hidden">
          <div id="registration-state" class="notice"></div>
          <label data-i18n-label="auth.email"><input name="email" type="email" required autocomplete="email"></label>
          <label data-i18n-label="auth.password"><input name="password" type="password" minlength="10" maxlength="128" required autocomplete="new-password"></label>
          <label data-i18n-label="auth.confirm_password"><input name="confirmPassword" type="password" minlength="10" maxlength="128" required autocomplete="new-password"></label>
          <button type="submit" data-i18n="auth.create_account"></button>
        </form>
        </div>
      </section>

      <section id="account-panel" class="hidden">
        <div class="my-account-bar">
          <div class="my-user">
            <span class="my-user-mark" aria-hidden="true">P</span>
            <span>
              <strong data-i18n="user.my.signed_in"></strong>
              <small id="my-user-email"></small>
            </span>
          </div>
          <div class="row-actions">
            <div class="my-package-count" aria-live="polite">
              <strong id="my-game-count">0</strong>
              <span data-i18n="user.my.package_count"></span>
            </div>
            <button type="button" class="secondary" data-open-dialog="profile-dialog" data-i18n="nav.account"></button>
            <button type="button" class="secondary" data-open-dialog="key-dialog" data-i18n="uploads.key"></button>
            <button type="button" data-open-dialog="upload-dialog" data-i18n="user.my.upload"></button>
            <button id="logout" type="button" class="secondary" data-i18n="nav.logout"></button>
          </div>
        </div>
        <div class="my-packages-heading">
          <div>
            <div class="eyebrow" data-i18n="user.my.packages_eyebrow"></div>
            <h2 data-i18n="user.my.packages_title"></h2>
          </div>
          <p data-i18n="user.my.packages_description"></p>
        </div>
        <div id="my-games" class="my-package-list"></div>
      </section>

      <dialog id="profile-dialog" class="my-dialog">
        <div class="dialog-heading">
          <div>
            <div class="eyebrow" data-i18n="user.my.account_eyebrow"></div>
            <h2 data-i18n="nav.account"></h2>
          </div>
          <button type="button" class="secondary dialog-close" data-close-dialog data-i18n="common.close"></button>
        </div>
        <form id="profile-form" class="stack">
          <label><span data-i18n="auth.email"></span><input id="profile-email" readonly></label>
          <label><span data-i18n="auth.display_name"></span><input name="displayName" maxlength="40" required></label>
          <button type="submit" data-i18n="common.save"></button>
        </form>
      </dialog>

      <dialog id="key-dialog" class="my-dialog">
        <div class="dialog-heading">
          <div>
            <div class="eyebrow" data-i18n="user.my.security_eyebrow"></div>
            <h2 data-i18n="uploads.key"></h2>
          </div>
          <button type="button" class="secondary dialog-close" data-close-dialog data-i18n="common.close"></button>
        </div>
        <form id="key-form" class="stack">
          <p class="dialog-description" data-i18n="user.my.key_description"></p>
          <label data-i18n-label="uploads.manual_key"><input name="key" type="password" minlength="10" maxlength="128" autocomplete="new-password"></label>
          <div class="row-actions">
            <button type="submit" data-i18n="uploads.save_rotate"></button>
            <button id="generate-key" type="button" class="secondary" data-i18n="uploads.create_key"></button>
          </div>
          <label data-i18n-label="uploads.key_once_label"><input id="created-key" readonly></label>
        </form>
      </dialog>

      <dialog id="upload-dialog" class="my-dialog">
        <div class="dialog-heading">
          <div>
            <div class="eyebrow" data-i18n="user.my.upload_eyebrow"></div>
            <h2 data-i18n="uploads.submit_version"></h2>
          </div>
          <button type="button" class="secondary dialog-close" data-close-dialog data-i18n="common.close"></button>
        </div>
        <form id="game-upload-form" class="stack">
          <p class="dialog-description" data-i18n="user.my.upload_description"></p>
          <label><span data-i18n="uploads.zip"></span><input name="package" type="file" accept=".zip,application/zip" required></label>
          <button type="submit" data-i18n="uploads.scan_submit"></button>
          <div id="upload-notice" class="notice" data-i18n="uploads.version_hint"></div>
        </form>
      </dialog>

      <dialog id="auth-captcha-dialog" class="captcha-dialog" aria-label="" data-i18n-aria="auth.captcha_title">
        <div id="user-captcha-widget" class="captcha-host"></div>
      </dialog>
    </section>

    <section id="user-games-view" class="page-view hidden">
      <div class="library-heading">
        <div>
          <div class="eyebrow" data-i18n="catalog.eyebrow"></div>
          <h1 data-i18n="catalog.title"></h1>
          <p data-i18n="catalog.description"></p>
        </div>
        <div class="library-count" aria-live="polite">
          <strong id="game-count">0</strong>
          <span data-i18n="catalog.count_label"></span>
        </div>
      </div>
      <form id="filters" class="filters">
        <label class="library-search">
          <span data-i18n="catalog.search_label"></span>
          <input name="name" placeholder="" data-i18n-placeholder="catalog.search">
        </label>
      </form>
      <div id="games" class="cards"></div>
      <div class="pager">
        <button id="previous" class="secondary" data-i18n="common.previous"></button>
        <span id="page-label" class="muted"></span>
        <button id="next" class="secondary" data-i18n="common.next"></button>
      </div>
    </section>
  </main>
</body>
</html>
